<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Task Management Portal</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/tasks">Tasks</a></li>
                    <li><a href="/users">Users</a></li>
                    <li><a href="/profile">Profile</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Dashboard Overview</h2>
            <div class="stats">
                <div class="stat-card">
                    <h3>Total Employees</h3>
                    <div class="value" id="total-employees">-</div>
                </div>
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <div class="value" id="total-tasks">-</div>
                </div>
                <div class="stat-card">
                    <h3>Completed Tasks</h3>
                    <div class="value" id="completed-tasks">-</div>
                </div>
                <div class="stat-card">
                    <h3>Pending Tasks</h3>
                    <div class="value" id="pending-tasks">-</div>
                </div>
            </div>

            <section class="recent-activity">
                <h3>Recent Activity</h3>
                <div id="recent-activity-list">
                    <p>Loading...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 SecureCI Target Application</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
