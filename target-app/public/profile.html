<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Employee Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Task Management Portal</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/tasks">Tasks</a></li>
                    <li><a href="/users">Users</a></li>
                    <li><a href="/profile">Profile</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>User Profile</h2>
            <div class="profile-section">
                <h3>Profile Information</h3>
                <form id="profile-form">
                    <div class="profile-field">
                        <label for="profile-name">Full Name</label>
                        <input type="text" id="profile-name" required>
                    </div>
                    <div class="profile-field">
                        <label for="profile-email">Email Address</label>
                        <input type="email" id="profile-email" required>
                    </div>
                    <div class="profile-field">
                        <label for="profile-department">Department</label>
                        <input type="text" id="profile-department" required>
                    </div>
                    <div class="profile-field">
                        <label for="profile-role">Role</label>
                        <input type="text" id="profile-role" required>
                    </div>
                    <div class="profile-field">
                        <label for="profile-employee-id">Employee ID</label>
                        <input type="text" id="profile-employee-id" required>
                    </div>
                    <div class="profile-field">
                        <label for="profile-hire-date">Hire Date</label>
                        <input type="date" id="profile-hire-date" required>
                    </div>
                    <button type="submit" class="btn">Update Profile</button>
                </form>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SecureCI Target Application</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
