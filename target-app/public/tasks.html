<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Employee Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Task Management Portal</h1>
            <nav>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/dashboard">Dashboard</a></li>
                    <li><a href="/tasks">Tasks</a></li>
                    <li><a href="/users">Users</a></li>
                    <li><a href="/profile">Profile</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <h2>Task Management</h2>
            <div class="task-form">
                <h3>Add New Task</h3>
                <form id="task-form">
                    <div class="form-group">
                        <label for="task-title">Title</label>
                        <input type="text" id="task-title" required>
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="task-assignee">Assignee</label>
                        <input type="text" id="task-assignee" required>
                    </div>
                    <button type="submit" class="btn">Add Task</button>
                </form>
            </div>

            <h3>Task List</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Assignee</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tasks-list">
                    <tr>
                        <td colspan="7">Loading tasks...</td>
                    </tr>
                </tbody>
            </table>
        </main>

        <footer>
            <p>&copy; 2026 SecureCI Target Application</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
